services:
  target-app:
    build: ./target-app
    container_name: target-app
    ports:
      - "8080:8080"
    environment:
      - OTEL_SERVICE_NAME=target-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      - jaeger

  worker-service:
    build: ./worker-service
    container_name: worker-service
    ports:
      - "8090:8090"
    environment:
      - OTEL_SERVICE_NAME=worker-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # UI + Query API
      - "4317:4317"     # OTLP gRPC receiver

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - target-app
      - worker-service
      - cadvisor

  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      - HAIKU_MODEL=${HAIKU_MODEL:-claude-haiku-4-5-20251001}
      - PROMETHEUS_URL=http://prometheus:9090
      - JAEGER_QUERY_URL=http://jaeger:16686
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_ADMIN_USER=admin
      - GRAFANA_ADMIN_PASSWORD=admin
      - TARGET_APP_URL=http://target-app:8080
      - WORKER_SERVICE_URL=http://worker-service:8090
      - AUDIT_LOG_PATH=/data/audit-log.jsonl
      - WIKI_DIR=/data/wiki
      - REPORTS_DIR=/data/reports
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - WATCH_ENABLED=${WATCH_ENABLED:-true}
      - WATCH_INTERVAL_SECONDS=${WATCH_INTERVAL_SECONDS:-30}
      - WATCH_CONTAINERS=${WATCH_CONTAINERS:-target-app,worker-service}
      - LEAK_THRESHOLD_BYTES=${LEAK_THRESHOLD_BYTES:-50000000}
      - WATCH_COOLDOWN_SECONDS=${WATCH_COOLDOWN_SECONDS:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backend-data:/data
      - ./backend:/app
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - prometheus
      - jaeger
      - grafana

  ui:
    build: ./ui
    container_name: ui
    ports:
      - "8501:8501"
    depends_on:
      - backend

  slack-bot:
    build: ./slack-bot
    container_name: slack-bot
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    profiles:
      - slack

volumes:
  backend-data:
